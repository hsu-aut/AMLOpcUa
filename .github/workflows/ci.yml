name: build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    # Windows, because the plugin targets net8.0-windows and WPF.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: |
          dotnet restore AMLOpcUa.sln
          dotnet build AMLOpcUa.sln -c Release --no-restore

      - name: Test
        run: dotnet test dotnet/OpcUaAml.Tests -c Release --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: Aml.Editor.Plugin.OpcUa-nupkg
          path: build/Plugins/Aml.Editor.Plugin.OpcUa/Release/*.nupkg

  release:
    # Only this job may write, and only for a version tag that matches the
    # package version.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aml.Editor.Plugin.OpcUa-nupkg
          path: nupkg

      - name: Check that the tag matches the package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "nupkg/Aml.Editor.Plugin.OpcUa.${version}.nupkg" || { ls nupkg; echo "no package for version ${version}"; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nupkg/*.nupkg
          generate_release_notes: true
          fail_on_unmatched_files: true
